<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculateur avec Modale</title>
    <!-- Lien vers le fichier CSS de Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>


    <style>
        /* Ajoutez ici des styles supplémentaires si nécessaire */
        .modal-content {
            border-radius: 0.5rem;
        }
        .btn-primary {
            background-color: #007bff;
            border-color: #007bff;
        }
        /* Petites touches de couleur pour les champs de formulaire */
        .form-control:focus {
            border-color: #80bdff;
            box-shadow: 0 0 0 0.2rem rgba(0, 123, 255, 0.25);
        }
    </style>
</head>
<body>

<!-- Bouton pour déclencher la modale -->
<button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#calculateurModal">
    Ouvrir le formulaire
</button>

<!-- Modale avec formulaire -->
<div class="modal fade" id="calculateurModal" tabindex="-1" aria-labelledby="calculateurModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="calculateurModalLabel">Calculateur</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form id="calculateurForm">
                    <!-- Répétez cette structure pour les 10 champs -->
                    <div class="mb-3">
                        <label for="inputField1" class="form-label">Champ 1</label>
                        <input type="text" class="form-control" id="inputField1" required>
                    </div>
                    <div class="mb-3">
                        <label for="inputField1" class="form-label">Champ 1</label>
                        <input type="text" class="form-control" id="inputField2" required>
                    </div>
                    <div class="mb-3">
                        <label for="inputField1" class="form-label">Champ 1</label>
                        <input type="text" class="form-control" id="inputField13" required>
                    </div>
                    <div class="mb-3">
                        <label for="inputField1" class="form-label">Champ 1</label>
                        <input type="text" class="form-control" id="inputField4" required>
                    </div>
                    <div class="mb-3">
                        <label for="inputField1" class="form-label">Champ 1</label>
                        <input type="text" class="form-control" id="inputField5" required>
                    </div>
                    <!-- ...autres champs... -->
                    <div class="mb-3">
                        <label for="inputField10" class="form-label">Champ 10</label>
                        <input type="text" class="form-control" id="inputField10" required>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Fermer</button>
                <button type="submit" class="btn btn-primary" form="calculateurForm">Calculer</button>
            </div>
        </div>
    </div>
</div>

<!-- Lien vers les fichiers JavaScript de Bootstrap -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    // Ici, vous pouvez ajouter votre logique de calcul en JavaScript
    $('#calculateurForm').on('submit', function(event) {
        event.preventDefault();
        // Récupérez les valeurs des champs et effectuez le calcul
        // ...
        alert('Calcul effectué !');
    });
</script>

</body>
</html>
